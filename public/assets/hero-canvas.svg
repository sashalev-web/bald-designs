<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Bald head as a design canvas</title>
  <desc id="heroDesc">Illustration of a bald head wearing a vivid geometric sticker design</desc>
  <!-- Soft atmospheric wash -->
  <defs>
    <radialGradient id="skin" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#F6C9A8"/>
      <stop offset="70%" stop-color="#E8A97A"/>
      <stop offset="100%" stop-color="#D4895E"/>
    </radialGradient>
    <linearGradient id="designFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="45%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFE14A"/>
    </linearGradient>
    <clipPath id="dome">
      <ellipse cx="320" cy="290" rx="168" ry="178"/>
    </clipPath>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="320" cy="310" rx="220" ry="240" fill="#FF2D55" opacity="0.06"/>
  <ellipse cx="320" cy="310" rx="190" ry="210" fill="#00C2FF" opacity="0.05"/>

  <!-- Neck -->
  <path d="M248 430 C250 520 270 610 320 640 C370 610 390 520 392 430 Z" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="320" cy="290" rx="168" ry="178" fill="url(#skin)"/>

  <!-- Ear L -->
  <ellipse cx="150" cy="310" rx="28" ry="42" fill="#E8A97A"/>
  <ellipse cx="156" cy="310" rx="14" ry="24" fill="#D4895E" opacity="0.45"/>
  <!-- Ear R -->
  <ellipse cx="490" cy="310" rx="28" ry="42" fill="#E8A97A"/>
  <ellipse cx="484" cy="310" rx="14" ry="24" fill="#D4895E" opacity="0.45"/>

  <!-- Sticker sheet on dome -->
  <g clip-path="url(#dome)">
    <ellipse cx="320" cy="250" rx="150" ry="130" fill="url(#designFill)"/>
    <!-- Geometric pattern -->
    <g opacity="0.95">
      <path d="M200 180 L280 140 L320 220 Z" fill="#00C2FF"/>
      <path d="M320 140 L420 170 L360 250 Z" fill="#111111" opacity="0.85"/>
      <circle cx="260" cy="260" r="36" fill="#FFE14A"/>
      <circle cx="380" cy="230" r="28" fill="#FFFFFF" opacity="0.9"/>
      <rect x="290" y="200" width="70" height="70" transform="rotate(18 325 235)" fill="#00E5A0"/>
      <path d="M220 300 Q320 240 420 310 Q320 360 220 300" fill="#FF2D55"/>
      <path d="M250 200 L270 280 L230 270 Z" fill="#FFFFFF" opacity="0.75"/>
      <path d="M390 280 L430 320 L370 340 Z" fill="#00C2FF"/>
    </g>
    <!-- Sheet edge highlight -->
    <ellipse cx="320" cy="250" rx="150" ry="130" stroke="#FFFFFF" stroke-width="4" opacity="0.55" fill="none"/>
  </g>

  <!-- Subtle scalp edge -->
  <path d="M168 300 C180 170 460 170 472 300" stroke="#C97A52" stroke-width="3" opacity="0.25" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="268" cy="340" rx="10" ry="12" fill="#1A1A1A"/>
  <ellipse cx="372" cy="340" rx="10" ry="12" fill="#1A1A1A"/>
  <circle cx="271" cy="337" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="375" cy="337" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Nose -->
  <path d="M320 350 L308 390 Q320 398 332 390 Z" fill="#D4895E"/>

  <!-- Smile -->
  <path d="M286 430 Q320 455 354 430" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
